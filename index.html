<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PantryPilot</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18221c;background:#f5f7f4}body{margin:0}.wrap{max-width:760px;margin:auto;padding:20px 16px 48px}h1{margin:4px 0 2px;font-size:30px}.sub{color:#657067;margin-bottom:18px}.card{background:white;border:1px solid #dfe5df;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #00000008}button{border:0;border-radius:11px;padding:12px 15px;font-weight:650;font-size:15px;cursor:pointer}.primary{background:#245c3a;color:white}.secondary{background:#e9eee9;color:#183321}input[type=file]{width:100%;margin:8px 0 12px}.status{font-size:14px;color:#5b665e;white-space:pre-wrap}.progress{height:7px;background:#e8ece8;border-radius:99px;overflow:hidden;margin:10px 0}.bar{height:100%;width:0;background:#245c3a}.item{border:1px solid #dde4dd;border-radius:13px;padding:12px;margin:9px 0}.row{display:flex;gap:9px;align-items:center}.row input[type=text]{flex:1}input[type=text],input[type=date],select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cfd8cf;border-radius:9px;font-size:15px;background:white}label{font-size:12px;color:#68736b;display:block;margin:9px 0 4px}.badge{font-size:11px;padding:4px 7px;border-radius:99px;background:#fff2c7;color:#735600;white-space:nowrap}.muted{color:#707a72;font-size:13px}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1}.hidden{display:none}.empty{color:#707a72;text-align:center;padding:20px}</style></head><body><div class="wrap"><h1>PantryPilot</h1><div class="sub">Receipt → groceries → pantry → use soon</div><div class="tabs"><button class="secondary" onclick="showTab('scan')">Scan receipt</button><button class="secondary" onclick="showTab('pantry')">Pantry</button></div><section id="scan"><div class="card"><strong>1. Add a receipt</strong><input id="receiptFile" type="file" accept="image/*" capture="environment"><button class="primary" onclick="readReceipt()">Read receipt</button><div class="progress"><div id="bar" class="bar"></div></div><div id="status" class="status">Nothing scanned yet.</div></div><div id="reviewCard" class="card hidden"><strong>2. Review what PantryPilot found</strong><p class="muted">I keep plausible product lines instead of silently dropping uncertain ones. Yellow items need a quick check.</p><div id="review"></div><div class="row"><button class="primary" onclick="addAll()">Add checked items</button><button class="secondary" onclick="clearReview()">Clear</button></div></div></section><section id="pantry" class="hidden"><div class="card"><strong>Your pantry</strong><div id="pantryList"></div></div></section></div><script>
const KEY='pantrypilot_v2_pantry';let reviewItems=[];const shelf=[[/milk|half.?and.?half|cream\\b/i,7],[/yogurt/i,14],[/cheese|cheddar|mozzarella|parmesan/i,30],[/chicken|turkey|ground beef|ground turkey|pork|beef/i,3],[/burger|patt(y|ies)|meatless|crumbles/i,7],[/deli|lunch meat/i,5],[/berries|strawberr|raspberr|blueberr/i,5],[/cilantro|dill|parsley|basil|herb/i,7],[/lettuce|spinach|greens/i,7],[/bread|bun|tortilla|wrapper/i,7],[/ranch|dressing|salsa/i,30],[/ginger beer|soda|coke|cola/i,60],[/beer/i,120]];
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function days(n){for(const [r,d] of shelf)if(r.test(n))return d;return 14}function datePlus(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}function storage(n){if(/milk|yogurt|cheese|chicken|beef|pork|turkey|ranch|dressing|cilantro|dill|herb|lettuce|spinach/i.test(n))return'Refrigerator';if(/burger|patty|meatless|crumbles|frozen/i.test(n))return'Freezer';return'Pantry'}
function showTab(t){document.getElementById('scan').classList.toggle('hidden',t!=='scan');document.getElementById('pantry').classList.toggle('hidden',t!=='pantry');if(t==='pantry')renderPantry()}
function obvious(x){x=x.toLowerCase().replace(/\s+/g,' ').trim();if(!x||x.length<3)return true;if(/^(subtotal|total|tax|change|cash|credit|debit|visa|mastercard|amex|discover|payment|tender|balance|approval|transaction|auth|card|receipt|thank|customer|store|address|phone|www\\.|http)/i.test(x))return true;if(/\b(payment|credit card|debit card|cash tender|amount due|sales tax|tax total)\b/i.test(x))return true;if(/^[\d\s$.,%:/#*-]+$/.test(x))return true;if(/^(fuel|gas|lottery|service fee|bag fee|coupon|discount|savings|member|rewards|points)\b/i.test(x))return true;if(/^\d{1,2}:\d{2}/.test(x))return true;return false}
function clean(x){return x.replace(/[|]/g,' ').replace(/\s+/g,' ').trim().replace(/^[^A-Za-z0-9]+/,'').replace(/[^A-Za-z0-9%)'’.,&+\-/ ]+$/,'').trim()}
function plausible(line){if(obvious(line))return false;let x=line.toLowerCase();if(/^(produce|grocery|dairy|meat|bakery|frozen|beverage|beer|wine|health|household|general merchandise)\s*:?\s*$/.test(x))return false;if(/\b(dept|department)\b/.test(x)&&x.length<35)return false;let letters=(line.match(/[A-Za-z]/g)||[]).length;if(letters<3)return false;let clue=/cheese|milk|chicken|beef|pork|turkey|burger|patty|patties|meatless|crumbles|bread|bun|tortilla|wrapper|ranch|dressing|cilantro|dill|salsa|soda|coke|beer|ginger|juice|yogurt|butter|egg|pasta|sauce|cereal|cracker|chip|snack|coffee|tea|apple|banana|tomato|onion|pepper|potato|carrot|lettuce|spinach|fruit|vegetable|farm|valley|hidden|morningstar|fever/i;return clue.test(x)||(letters>=7&&line.split(/\s+/).length>=2&&!/\b(total|subtotal|tax)\b/i.test(x))}
function norm(x){x=clean(x);for(const [r,t] of [[/\bMSF\b/ig,'MorningStar Farms'],[/\bGRDN\b/ig,'Garden'],[/\bVG\b/ig,'Veggie'],[/\bPATTIE?S?\b/ig,'Patties'],[/\bHDDN\b/ig,'Hidden'],[/\bVLY\b/ig,'Valley'],[/\b8\s*PK\b/ig,'8-pack'],[/\b24\s*PK\b/ig,'24-pack']])x=x.replace(r,t);return x.replace(/\s+/g,' ').trim()}
function dedupe(a){let s=new Set;return a.filter(x=>{let k=x.toLowerCase().replace(/[^a-z0-9]/g,'');if(!k||s.has(k))return false;s.add(k);return true})}
async function readReceipt(){let f=document.getElementById('receiptFile').files[0],st=document.getElementById('status'),bar=document.getElementById('bar');if(!f){st.textContent='Choose a receipt photo first.';return}st.textContent='Reading receipt…';bar.style.width='8%';try{let r=await Tesseract.recognize(f,'eng',{logger:m=>{if(m.progress)bar.style.width=Math.max(8,Math.round(m.progress*100))+'%';if(m.status)st.textContent=m.status.replace(/_/g,' ')+'…'}});bar.style.width='100%';let lines=r.data.text.split(/\r?\n/).map(clean).filter(Boolean);let c=dedupe(lines.filter(plausible).map(norm));if(c.length<8)c=dedupe([...c,...lines.filter(x=>!obvious(x)).map(norm)]).filter(x=>x.length>=4).slice(0,60);reviewItems=c.map((name,i)=>({id:Date.now()+'-'+i,name,checked:true,needsReview:!shelf.some(([r])=>r.test(name)),date:datePlus(new Date(),days(name)),storage:storage(name)}));renderReview();document.getElementById('reviewCard').classList.remove('hidden');st.textContent=`Found ${reviewItems.length} possible grocery lines. Review the list before adding them.`}catch(e){console.error(e);st.textContent="I couldn't read this receipt. Try a clearer, well-lit photo."}}
function renderReview(){document.getElementById('review').innerHTML=reviewItems.map((it,i)=>`<div class="item"><div class="row"><input type="checkbox" ${it.checked?'checked':''} onchange="reviewItems[${i}].checked=this.checked"><input type="text" value="${esc(it.name)}" onchange="reviewItems[${i}].name=this.value">${it.needsReview?'<span class="badge">Needs review</span>':''}</div><label>Storage</label><select onchange="reviewItems[${i}].storage=this.value">${['Pantry','Refrigerator','Freezer'].map(s=>`<option ${it.storage===s?'selected':''}>${s}</option>`).join('')}</select><label>Estimated use-by</label><input type="date" value="${it.date}" onchange="reviewItems[${i}].date=this.value"></div>`).join('')||'<div class="empty">No product lines found.</div>'}
function addAll(){let p=JSON.parse(localStorage.getItem(KEY)||'[]');reviewItems.filter(x=>x.checked&&x.name.trim()).forEach(x=>p.push({id:Date.now()+'-'+Math.random(),name:x.name.trim(),date:x.date,storage:x.storage}));localStorage.setItem(KEY,JSON.stringify(p));clearReview();showTab('pantry')}function clearReview(){reviewItems=[];document.getElementById('reviewCard').classList.add('hidden')}function renderPantry(){let p=JSON.parse(localStorage.getItem(KEY)||'[]');p.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));document.getElementById('pantryList').innerHTML=p.length?p.map((x,i)=>`<div class="item"><div class="row"><strong>${esc(x.name)}</strong><span class="badge">${esc(x.storage)}</span></div><div class="muted">Estimated use-by: ${esc(x.date||'—')}</div><button class="secondary" style="margin-top:8px" onclick="removePantry(${i})">Remove</button></div>`).join(''):'<div class="empty">Your pantry is empty.</div>'}function removePantry(i){let p=JSON.parse(localStorage.getItem(KEY)||'[]');p.splice(i,1);localStorage.setItem(KEY,JSON.stringify(p));renderPantry()}
</script></body></html>
