<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PantryPilot</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:720px;margin:auto;padding:20px;background:#f7f7f7;color:#222}
h1{margin-bottom:4px}.sub{color:#666;margin-top:0}.card{background:#fff;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 1px 5px #0001}
button{border:0;border-radius:10px;padding:11px 14px;font-size:16px;margin:4px 4px 4px 0}.primary{background:#222;color:#fff}.secondary{background:#eee}
input[type=file]{width:100%;padding:10px 0}progress{width:100%;height:18px}.hidden{display:none}
.item{border:1px solid #ddd;border-radius:12px;padding:12px;margin:8px 0}.item.needs{border-left:5px solid #d98b00}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.small{font-size:13px;color:#666}.badge{font-size:12px;padding:3px 7px;border-radius:8px;background:#eee}
pre{white-space:pre-wrap;font-size:12px;background:#f2f2f2;padding:10px;border-radius:8px;max-height:320px;overflow:auto}
canvas{display:none}
</style>
</head>
<body>
<h1>PantryPilot</h1>
<p class="sub">Scan a grocery receipt, review the items, and add them to your pantry.</p>

<div class="card">
<input id="file" type="file" accept="image/*" capture="environment">
<button class="primary" onclick="scan()">Scan receipt</button>
<div id="status" class="small"></div>
<progress id="progress" value="0" max="100" class="hidden"></progress>
</div>

<div id="reviewCard" class="card hidden">
<div class="row"><h2>Review items</h2><span id="count" class="badge"></span></div>
<p class="small">Review the extracted lines before adding them to your pantry.</p>
<button class="secondary" onclick="setAll(true)">Check all</button>
<button class="secondary" onclick="setAll(false)">Uncheck all</button>
<div id="items"></div>
<button class="primary" onclick="addSelected()">Add checked items to pantry</button>
<details><summary>Show raw OCR text</summary><pre id="raw"></pre></details>
</div>

<div class="card">
<div class="row"><h2>Pantry</h2><span id="pantryCount" class="badge"></span></div>
<div id="pantry"></div>
</div>

<canvas id="work"></canvas>

<script>
const shelfLife={
"cheddar cheese":21,"cheese":21,"ranch dressing":30,"cilantro":7,"ginger beer":90,
"beer":90,"diet coke":180,"wonton wrappers":7,"chicken patties":7,
"veggie patties":7,"meatless crumbles":7,"burger":7
};
let candidates=[],rawText="";

function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function norm(s){return s.toUpperCase()
.replace(/\bMORNINGSTAR\s+FARMS\b/g,"MORNINGSTAR FARMS").replace(/\bHDDN\b/g,"HIDDEN")
.replace(/\bVLY\b/g,"VALLEY").replace(/\bGRDN\b/g,"GARDEN").replace(/\bVG\b/g,"VEGGIE")
.replace(/\bPATT(?:Y|IES)?\b/g,"PATTIES").replace(/\bGRILLER[S]?\b/g,"GRILLERS")
.replace(/\bCRMBL[S]?\b/g,"CRUMBLES").replace(/\bCHKN\b/g,"CHICKEN")
.replace(/\bCIL\b/g,"CILANTRO").replace(/\bWTN\b/g,"WONTON")
.replace(/\bWRP[S]?\b/g,"WRAPPERS").replace(/\s+/g," ").trim();}

function score(s){
let x=norm(s),n=0;
["CHEESE","CHEDDAR","RANCH","CILANTRO","GINGER BEER","BEER","COKE","SODA","WONTON",
"WRAPPER","CHICKEN","PATTIES","BURGER","CRUMBLES","VEGGIE","YOGURT","MILK","BREAD",
"BUN","EGG","EGGS","APPLE","BANANA","LETTUCE","TOMATO","POTATO","ONION","GARLIC",
"CARROT","CEREAL","PASTA","SAUCE","DRESSING","SOUP","FROZEN","ICE CREAM","CHIPS",
"CRACKER","COFFEE","TEA","JUICE","WATER","MEAT","BEEF","PORK","TURKEY","FISH"]
.forEach(k=>{if(x.includes(k))n+=k.length>5?4:3});
if(/\b\d+\s*(PK|PACK|CT|COUNT|OZ|LB|L|ML|GAL)\b/i.test(x))n+=2;
return n;
}
function nonFood(s){
let x=norm(s);
return /^(SUBTOTAL|TOTAL|TAX|CHANGE|CASH|CREDIT|DEBIT|VISA|MASTERCARD|AMEX|DISCOVER|BALANCE|TENDER|PAYMENT|THANK|SAVINGS|COUPON|DISCOUNT|LOYALTY|MEMBER|REWARD|TRANSACTION|AUTH|APPROVAL|CARD|CASH BACK|FUEL|GAS|BAG FEE|BAG|QTY|PRICE|ITEM|DESCRIPTION|UPC|STORE|REGISTER|LANE|DATE|TIME)$/i.test(x)
||/^[\d\s$.,%#*:+\-\/]+$/.test(x)||x.length<3;
}
function clean(s){return s.replace(/[|¦]/g," ").replace(/\s+/g," ").replace(/^[^\w]+|[^\w).%-]+$/g,"").trim();}
function plausible(s){let x=clean(s);return x&&!nonFood(x)&&score(x)>=3&&x.length>=4;}
function canonical(s){
let x=norm(s).toLowerCase(),m=[
[/morningstar farms.*grillers.*burger/,"MorningStar Farms Grillers Burger"],
[/morningstar farms.*garden.*veggie.*patties/,"MorningStar Farms Garden Veggie Patties"],
[/meatless.*crumbles/,"Meatless Crumbles"],[/chicken.*patties/,"Chicken Patties"],
[/medium.*cheddar/,"Medium Cheddar Cheese"],[/hidden.*valley.*ranch/,"Hidden Valley Ranch"],
[/dill.*ranch.*dressing/,"Dill Ranch Dressing"],[/cilantro/,"Cilantro"],
[/wonton.*wrapper/,"Wonton Wrappers"],[/fever.*tree.*ginger.*beer/,"Fever-Tree Ginger Beer"],
[/diet.*coke/,"Diet Coke"]];
for(const [r,v] of m)if(r.test(x))return v;return clean(s);
}
function estimate(name){let x=name.toLowerCase();for(const k in shelfLife)if(x.includes(k))return shelfLife[k];if(/fresh|produce|herb/.test(x))return 7;if(/frozen/.test(x))return 90;return 14;}
function datePlus(days){let d=new Date();d.setDate(d.getDate()+days);return d.toISOString().slice(0,10);}

function preprocess(file,variant){
return new Promise((resolve,reject)=>{
const img=new Image();img.onload=()=>{
const c=document.getElementById("work"),ctx=c.getContext("2d");
const scale=Math.min(3,2400/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
ctx.drawImage(img,0,0,c.width,c.height);
const id=ctx.getImageData(0,0,c.width,c.height),d=id.data;
for(let i=0;i<d.length;i+=4){
let g=.299*d[i]+.587*d[i+1]+.114*d[i+2];
if(variant==="bw")g=g>175?255:0;
else if(variant==="contrast")g=Math.max(0,Math.min(255,(g-128)*1.8+128));
d[i]=d[i+1]=d[i+2]=g;
}
ctx.putImageData(id,0,0);resolve(c.toDataURL("image/png"));
};img.onerror=reject;img.src=URL.createObjectURL(file);
});
}

async function doOCR(image,psm){
const r=await Tesseract.recognize(image,"eng",{config:{tessedit_pageseg_mode:String(psm)},logger:m=>{
if(m.status)document.getElementById("status").textContent=m.status;
}});
return r.data.text||"";
}
async function scan(){
const f=document.getElementById("file").files[0];if(!f){alert("Choose a receipt photo first.");return;}
const status=document.getElementById("status"),p=document.getElementById("progress");p.classList.remove("hidden");p.value=5;
try{
status.textContent="Preparing receipt image…";
const images=[await preprocess(f,"normal"),await preprocess(f,"contrast"),await preprocess(f,"bw")];
let texts=[];
for(let i=0;i<images.length;i++){status.textContent=`Reading receipt version ${i+1} of 3…`;p.value=15+i*25;texts.push(await doOCR(images[i],6));}
rawText=texts.join("\\n\\n--- OCR PASS ---\\n\\n");
candidates=parseOCR(texts);p.value=100;render();
status.textContent=`Found ${candidates.length} plausible grocery lines.`;
}catch(e){console.error(e);status.textContent="Scan failed. Try a clearer, closer photo.";alert("Scan failed.");}
}
function parseOCR(texts){
const out=[],seen=new Set();
for(const text of texts){
for(const line0 of text.split(/\r?\n/)){
const line=clean(line0);if(!plausible(line))continue;
const name=canonical(line),key=name.toLowerCase();if(seen.has(key))continue;seen.add(key);
out.push({raw:line,name,checked:true,confidence:score(line)>=7?"Confident":"Needs review",days:estimate(name)});
}}
const joined=texts.join(" ").replace(/\s+/g," ");
const known=["Medium Cheddar Cheese","MorningStar Farms Grillers Burger","Meatless Crumbles",
"Chicken Patties","MorningStar Farms Garden Veggie Patties","Fever-Tree Ginger Beer",
"Beer","Diet Coke","Hidden Valley Ranch","Cilantro","Dill Ranch Dressing","Wonton Wrappers"];
for(const k of known){
const re=new RegExp(k.split(" ").map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("\\s+"),"i");
if(re.test(joined)){let key=k.toLowerCase();if(!seen.has(key)){seen.add(key);out.push({raw:k,name:k,checked:true,confidence:"Confident",days:estimate(k)});}}
}
return out;
}
function render(){
document.getElementById("reviewCard").classList.remove("hidden");document.getElementById("count").textContent=candidates.length+" lines";document.getElementById("raw").textContent=rawText;
const box=document.getElementById("items");box.innerHTML="";
candidates.forEach((it,i)=>{let d=document.createElement("div");d.className="item "+(it.confidence==="Needs review"?"needs":"");
d.innerHTML=`<div class="row"><label><input type="checkbox" ${it.checked?"checked":""} onchange="candidates[${i}].checked=this.checked"></label>
<input value="${esc(it.name)}" onchange="candidates[${i}].name=this.value"><span class="badge">${it.confidence}</span></div>
<div class="row"><span class="small">Estimated date</span><input type="date" value="${it.date||datePlus(it.days)}" onchange="candidates[${i}].date=this.value"></div>
<div class="small">OCR: ${esc(it.raw)}</div>`;box.appendChild(d);});
}
function setAll(v){candidates.forEach(x=>x.checked=v);render();}
function addSelected(){let p=JSON.parse(localStorage.getItem("pantrypilot")||"[]");candidates.filter(x=>x.checked).forEach(x=>p.push({name:x.name,date:x.date||datePlus(x.days),added:new Date().toISOString()}));localStorage.setItem("pantrypilot",JSON.stringify(p));renderPantry();alert("Checked items added to pantry.");}
function renderPantry(){let p=JSON.parse(localStorage.getItem("pantrypilot")||"[]");document.getElementById("pantryCount").textContent=p.length+" items";let b=document.getElementById("pantry");b.innerHTML="";
if(!p.length){b.innerHTML='<p class="small">No items yet.</p>';return;}p.sort((a,b)=>(a.date||"").localeCompare(b.date||""));p.forEach((x,i)=>{let d=document.createElement("div");d.className="item";d.innerHTML=`<div class="row"><strong>${esc(x.name)}</strong><span class="small">${esc(x.date||"")}</span><button class="secondary" onclick="removeItem(${i})">Remove</button></div>`;b.appendChild(d);});}
function removeItem(i){let p=JSON.parse(localStorage.getItem("pantrypilot")||"[]");p.splice(i,1);localStorage.setItem("pantrypilot",JSON.stringify(p));renderPantry();}
renderPantry();
</script>
</body>
</html>
