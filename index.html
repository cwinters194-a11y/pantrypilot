</header>

    <h2>Scan receipt</h2>

      type="file"
      accept="image/*"
      capture="environment"

    <div id="progress" class="progress"></div>
  </section>

    <button class="secondary" onclick="checkAll()">Check all</button>
    <button class="secondary" onclick="uncheckAll()">Uncheck all</button>

    <div id="reviewList"></div>

    <button onclick="addCheckedToPantry()">
      Add checked items to pantry
    </button>

    <details>
      <summary>Show raw OCR text</summary>
      <pre id="rawOCR"></pre>
    </details>

  </section>

    <h2>Pantry</h2>

    <div id="pantryList"></div>

  </section>

const GROCERY_WORDS = [

/* ============================================================
   STATE
   ============================================================ */

let currentReviewItems = [];
let rawOCRText = "";


/* ============================================================
   OCR NORMALIZATION
   ============================================================ */

function normalizeOCR(text) {

  let s = String(text || "").toLowerCase();

  /*
   * Common OCR substitutions.
   */

  const replacements = [

    [/\bmsf\b/g, "morningstar farms"],
    [/\bmorn(?:ing)?\s*star\b/g, "morningstar"],

    [/\bhddn\b/g, "hidden"],
    [/\bvly\b/g, "valley"],

    [/\bgriller\b/g, "grillers"],
    [/\bgril+ers\b/g, "grillers"],
    [/\brll+ers\b/g, "grillers"],
    [/\brillers\b/g, "grillers"],

    [/\bburgr\b/g, "burger"],
    [/\bbur?ger\b/g, "burger"],

    [/\bcrmbles\b/g, "crumbles"],
    [/\bcrmbles\b/g, "crumbles"],
    [/\bcrumbl(?:e)?s\b/g, "crumbles"],
    [/\brumbles\b/g, "crumbles"],
    [/\bporumbles\b/g, "crumbles"],

    [/\bchkn\b/g, "chicken"],
    [/\bchicks\b/g, "chicken"],
    [/\bchick(?:e)?n\b/g, "chicken"],

    [/\bpattie\b/g, "patty"],
    [/\bpatties\b/g, "patty"],
    [/\bpatties\b/g, "patty"],
    [/\bpate\b/g, "patty"],

    [/\bwrp\b/g, "wrapper"],
    [/\bwrprs\b/g, "wrappers"],

    [/\bcil\b/g, "cilantro"],

    [/\bmed\b/g, "medium"],

    [/\bchedd?ar\b/g, "cheddar"],

    [/\bsomeeze\b/g, "squeeze"],

    [/\bnon?ton\b/g, "wonton"],
    [/\bonton\b/g, "wonton"],
    [/\blonton\b/g, "wonton"],
    [/\bhonton\b/g, "wonton"],

    [/\bwiukun\b/g, "morningstar farms"],
    [/\bwi ukun\b/g, "morningstar farms"]
  ];


  for (const [pattern, replacement] of replacements) {
    s = s.replace(pattern, replacement);
  }


  /*
   * Remove obvious prices.
   */

  s = s.replace(/\$\s*\d+(?:[.,]\d{1,2})?/g, " ");
  s = s.replace(/\b\d+\.\d{2}\b/g, " ");


  /*
   * Remove isolated long numeric strings,
   * which are usually UPCs / receipt numbers.
   */

  s = s.replace(/\b\d{5,}\b/g, " ");


  /*
   * Normalize punctuation.
   */

  s = s.replace(/[^a-z0-9\s]/g, " ");
  s = s.replace(/\s+/g, " ").trim();

  return s;
}


/* ============================================================
   LEVENSHTEIN DISTANCE
   ============================================================ */

function levenshtein(a, b) {

  a = String(a);
  b = String(b);

  const matrix = [];

  for (let i = 0; i <= b.length; i++) {
    matrix[i] = [i];
  }

  for (let j = 0; j <= a.length; j++) {
    matrix[0][j] = j;
  }

  for (let i = 1; i <= b.length; i++) {

    for (let j = 1; j <= a.length; j++) {

      if (b.charAt(i - 1) === a.charAt(j - 1)) {
        matrix[i][j] = matrix[i - 1][j - 1];
      } else {
        matrix[i][j] = Math.min(
          matrix[i - 1][j - 1] + 1,
          matrix[i][j - 1] + 1,
          matrix[i - 1][j] + 1
        );
      }
    }
  }

  return matrix[b.length][a.length];
}


/* ============================================================
   STRING SIMILARITY
   ============================================================ */

function similarity(a, b) {

  a = normalizeOCR(a);
  b = normalizeOCR(b);

  if (!a || !b) return 0;

  if (a === b) return 1;

  if (a.includes(b) || b.includes(a)) {
    return 0.92;
  }

  const distance = levenshtein(a, b);

  return 1 - distance / Math.max(a.length, b.length);
}


/* ============================================================
   TOKEN OVERLAP
   ============================================================ */

function tokenOverlap(a, b) {

  const aTokens = [...new Set(normalizeOCR(a).split(/\s+/).filter(Boolean))];
  const bTokens = [...new Set(normalizeOCR(b).split(/\s+/).filter(Boolean))];

  if (!aTokens.length || !bTokens.length) {
    return 0;
  }

  let matches = 0;

  for (const aToken of aTokens) {

    let best = 0;

    for (const bToken of bTokens) {

      const sim = similarity(aToken, bToken);

      if (sim > best) {
        best = sim;
      }
    }

    if (best >= 0.72) {
      matches++;
    }
  }

  return matches / Math.max(aTokens.length, bTokens.length);
}


/* ============================================================
   FUZZY FAMILY SCORE
   ============================================================ */

function fuzzyFamilyScore(ocrText, family) {

  const normalizedOCR = normalizeOCR(ocrText);

  let bestScore = 0;

  for (const alias of family.aliases) {

    const normalizedAlias = normalizeOCR(alias);

    const characterScore =
      similarity(normalizedOCR, normalizedAlias);

    const tokenScore =
      tokenOverlap(normalizedOCR, normalizedAlias);

    let substringScore = 0;

    if (
      normalizedOCR.includes(normalizedAlias) ||
      normalizedAlias.includes(normalizedOCR)
    ) {
      substringScore = 0.95;
    }

    /*
     * Combine the measures.
     */

    const score =
      characterScore * 0.50 +
      tokenScore * 0.30 +
      substringScore * 0.20;

    if (score > bestScore) {
      bestScore = score;
    }
  }

  return bestScore;
}


/* ============================================================
   KNOWN FAMILY MATCHING
   ============================================================ */

function matchKnownFamily(text) {

  let bestFamily = null;
  let bestScore = 0;

  for (const family of PRODUCT_FAMILIES) {

    const score = fuzzyFamilyScore(text, family);

    if (score > bestScore) {
      bestScore = score;
      bestFamily = family;
    }
  }

  /*
   * Slightly lower threshold for short OCR strings,
   * but require stronger evidence for very short strings.
   */

  const normalized = normalizeOCR(text);

  let threshold = 0.57;

  if (normalized.length < 8) {
    threshold = 0.72;
  } else if (normalized.length < 14) {
    threshold = 0.63;
  }

  if (bestFamily && bestScore >= threshold) {

    return {
      family: bestFamily,
      score: bestScore
    };
  }

  return null;
}


/* ============================================================
   DEPARTMENT FILTER
   ============================================================ */

function isDepartmentLine(text) {

  const normalized = normalizeOCR(text);

  if (!normalized) {
    return true;
  }

  /*
   * Exact department/header lines.
   */

  for (const department of DEPARTMENT_LINES) {

    if (normalized === department) {
      return true;
    }

    if (
      normalized.length < 30 &&
      normalized.includes(department) &&
      department.length >= 5
    ) {
      return true;
    }
  }

  /*
   * Payment / transaction lines.
   */

  if (/^\d+\s*(cash|credit|debit)$/i.test(normalized)) {
    return true;
  }

  if (/^(item|items)\s+\d+$/i.test(normalized)) {
    return true;
  }

  return false;
}


/* ============================================================
   DETERMINE WHETHER UNMATCHED LINE LOOKS LIKE A GROCERY ITEM
   ============================================================ */

function looksLikeUnmatchedGrocery(text) {

  const normalized = normalizeOCR(text);

  if (!normalized) {
    return false;
  }

  if (isDepartmentLine(normalized)) {
    return false;
  }

  /*
   * Very short OCR garbage is unlikely to be useful.
   */

  if (normalized.length < 4) {
    return false;
  }

  /*
   * Lines consisting almost entirely of numbers are not products.
   */

  const letters = (normalized.match(/[a-z]/g) || []).length;
  const numbers = (normalized.match(/[0-9]/g) || []).length;

  if (letters < 3) {
    return false;
  }

  if (numbers > letters * 2) {
    return false;
  }

  /*
   * Explicit grocery vocabulary.
   */

  const hasGroceryWord = GROCERY_WORDS.some(word =>
    normalized.includes(word)
  );

  if (hasGroceryWord) {
    return true;
  }

  /*
   * Lines with several alphabetic words are worth human review.
   */

  const words = normalized.split(/\s+/).filter(Boolean);

  if (words.length >= 2 && letters >= 6) {
    return true;
  }

  return false;
}


/* ============================================================
   CLEAN OCR LINE
   ============================================================ */

function cleanOCRLine(line) {

  let text = String(line || "").trim();

  /*
   * Remove isolated receipt symbols.
   */

  text = text.replace(/[|¦]/g, " ");

  /*
   * Remove leading / trailing junk.
   */

  text = text.replace(/^[^a-zA-Z0-9]+/, "");
  text = text.replace(/[^a-zA-Z0-9]+$/, "");

  /*
   * Collapse whitespace.
   */

  text = text.replace(/\s+/g, " ").trim();

  return text;
}


/* ============================================================
   FUZZY DUPLICATE CHECK
   ============================================================ */

function isDuplicate(existingItems, candidate) {

  for (const existing of existingItems) {

    /*
     * Known products with the same family are duplicates.
     */

    if (
      candidate.familyName &&
      existing.familyName &&
      candidate.familyName === existing.familyName
    ) {
      return true;
    }

    /*
     * Unmatched lines can still be duplicate OCR readings.
     */

    const sim = similarity(
      candidate.rawText,
      existing.rawText
    );

    if (sim >= 0.82) {
      return true;
    }

    const overlap = tokenOverlap(
      candidate.rawText,
      existing.rawText
    );

    if (overlap >= 0.75) {
      return true;
    }
  }

  return false;
}


/* ============================================================
   PARSE OCR
   ============================================================ */

function parseOCR(text) {

  const lines = text
    .split(/\r?\n/)
    .map(cleanOCRLine)
    .filter(Boolean);

  const items = [];

  for (const line of lines) {

    if (isDepartmentLine(line)) {
      continue;
    }

    const known = matchKnownFamily(line);

    if (known) {

      const item = {
        id: crypto.randomUUID(),
        name: known.family.name,
        familyName: known.family.name,
        rawText: line,
        confidence: "Confident",
        shelfLife: known.family.shelfLife,
        score: known.score,
        checked: true
      };

      if (!isDuplicate(items, item)) {
        items.push(item);
      }

      continue;
    }


    /*
     * If we can't confidently identify it,
     * retain it only if it looks like a plausible grocery item.
     */

    if (looksLikeUnmatchedGrocery(line)) {

      const item = {
        id: crypto.randomUUID(),
        name: line,
        familyName: null,
        rawText: line,
        confidence: "Needs review",
        shelfLife: 7,
        score: 0,
        checked: true
      };

      if (!isDuplicate(items, item)) {
        items.push(item);
      }
    }
  }

  return items;
}


/* ============================================================
   ESTIMATED DATE
   ============================================================ */

function estimatedDate(days) {

  const date = new Date();

  date.setDate(date.getDate() + Number(days || 7));

  return date.toISOString().split("T")[0];
}


/* ============================================================
   SCAN RECEIPT
   ============================================================ */

async function scanReceipt() {

  const input = document.getElementById("receiptInput");
  const progress = document.getElementById("progress");

  if (!input.files || !input.files.length) {

    progress.textContent = "Please choose a receipt photo first.";

    return;
  }

  const file = input.files[0];

  progress.textContent = "Reading receipt…";

  try {

    const result = await Tesseract.recognize(
      file,
      "eng",
      {
        logger: message => {

          if (message.status === "recognizing text") {

            const percent =
              Math.round((message.progress || 0) * 100);

            progress.textContent =
              `Reading receipt… ${percent}%`;
          }
        }
      }
    );


    rawOCRText = result.data.text || "";

    currentReviewItems = parseOCR(rawOCRText);

    renderReview();

    progress.textContent =
      `Scan complete. Found ${currentReviewItems.length} possible grocery items.`;

  } catch (error) {

    console.error(error);

    progress.textContent =
      "Sorry — the receipt could not be read.";

  }
}


/* ============================================================
   RENDER REVIEW
   ============================================================ */

function renderReview() {

  const section =
    document.getElementById("reviewSection");

  const list =
    document.getElementById("reviewList");

  const summary =
    document.getElementById("reviewSummary");

  const raw =
    document.getElementById("rawOCR");


  section.classList.remove("hidden");

  summary.textContent =
    `${currentReviewItems.length} possible grocery line${currentReviewItems.length === 1 ? "" : "s"} found. ` +
    `Known products are matched automatically; uncertain items are marked Needs review.`;


  raw.textContent = rawOCRText;


  if (!currentReviewItems.length) {

    list.innerHTML =
      `<div class="empty">
        No likely grocery items were identified.
      </div>`;

    return;
  }


  list.innerHTML = "";


  currentReviewItems.forEach((item, index) => {

    const container =
      document.createElement("div");

    container.className = "item";


    const badgeClass =
      item.confidence === "Confident"
        ? "badge confident"
        : "badge review";


    const date =
      estimatedDate(item.shelfLife);


    container.innerHTML = `

      <div class="item-header">

        <input
          type="checkbox"
          id="check-${index}"
          ${item.checked ? "checked" : ""}
          onchange="toggleChecked(${index}, this.checked)"
        >

        <div class="item-main">

          <div class="${badgeClass}">
            ${item.confidence}
          </div>

          <label>
            Item name
          </label>

          <input
            type="text"
            value="${escapeHTML(item.name)}"
            onchange="updateItemName(${index}, this.value)"
          >

          <div style="margin-top:10px;">

            <label>
              Estimated use-by date
            </label>

            <input
              type="date"
              value="${date}"
              onchange="updateItemDate(${index}, this.value)"
            >

          </div>

          <div class="ocr-text">
            OCR: ${escapeHTML(item.rawText)}
          </div>

        </div>

      </div>
    `;


    list.appendChild(container);
  });
}


/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* ============================================================
   REVIEW EDITING
   ============================================================ */

function toggleChecked(index, checked) {

  if (currentReviewItems[index]) {
    currentReviewItems[index].checked = checked;
  }
}


function updateItemName(index, name) {

  if (currentReviewItems[index]) {
    currentReviewItems[index].name = name;
  }
}


function updateItemDate(index, date) {

  if (currentReviewItems[index]) {
    currentReviewItems[index].estimatedDate = date;
  }
}


/* ============================================================
   CHECK / UNCHECK
   ============================================================ */

function checkAll() {

  currentReviewItems.forEach(item => {
    item.checked = true;
  });

  renderReview();
}


function uncheckAll() {

  currentReviewItems.forEach(item => {
    item.checked = false;
  });

  renderReview();
}


/* ============================================================
   PANTRY STORAGE
   ============================================================ */

function getPantry() {

  try {

    return JSON.parse(
      localStorage.getItem("pantrypilot_pantry") || "[]"
    );

  } catch {

    return [];
  }
}


function savePantry(pantry) {

  localStorage.setItem(
    "pantrypilot_pantry",
    JSON.stringify(pantry)
  );
}


/* ============================================================
   ADD TO PANTRY
   ============================================================ */

function addCheckedToPantry() {

  const pantry = getPantry();

  const checkedItems =
    currentReviewItems.filter(item => item.checked);


  checkedItems.forEach(item => {

    const date =
      item.estimatedDate ||
      estimatedDate(item.shelfLife);


    pantry.push({
      id: crypto.randomUUID(),
      name: item.name,
      addedDate: new Date().toISOString().split("T")[0],
      estimatedDate: date,
      rawOCR: item.rawText,
      confidence: item.confidence
    });

  });


  savePantry(pantry);

  renderPantry();

  renderUseSoon();


  /*
   * Remove added items from review.
   */

  currentReviewItems =
    currentReviewItems.filter(item => !item.checked);

  renderReview();
}


/* ============================================================
   RENDER PANTRY
   ============================================================ */

function renderPantry() {

  const pantry =
    getPantry();

  const container =
    document.getElementById("pantryList");


  if (!pantry.length) {

    container.innerHTML =
      `<div class="empty">
        Your pantry is empty.
      </div>`;

    return;
  }


  container.innerHTML = "";


  pantry.forEach(item => {

    const div =
      document.createElement("div");

    div.className = "pantry-item";


    div.innerHTML = `

      <strong>
        ${escapeHTML(item.name)}
      </strong>

      <div class="muted">
        Estimated use-by:
        ${escapeHTML(item.estimatedDate)}
      </div>

    `;


    container.appendChild(div);
  });
}


/* ============================================================
   USE SOON
   ============================================================ */

function renderUseSoon() {

  const pantry =
    getPantry();

  const container =
    document.getElementById("useSoonList");


  if (!pantry.length) {

    container.innerHTML =
      `<div class="empty">
        Nothing in your pantry yet.
      </div>`;

    return;
  }


  const today =
    new Date();


  const sorted =
    [...pantry].sort((a, b) => {

      const dateA =
        new Date(a.estimatedDate);

      const dateB =
        new Date(b.estimatedDate);

      return dateA - dateB;
    });


  const soon =
    sorted.slice(0, 10);


  container.innerHTML = "";


  soon.forEach(item => {

    const date =
      new Date(item.estimatedDate);


    const diff =
      Math.ceil(
        (date - today) /
        (1000 * 60 * 60 * 24)
      );


    const div =
      document.createElement("div");

    div.className = "pantry-item";


    let timing = "";


    if (diff < 0) {
      timing = "Past estimated date";
    } else if (diff === 0) {
      timing = "Estimated date is today";
    } else if (diff === 1) {
      timing = "About 1 day remaining";
    } else {
      timing = `About ${diff} days remaining`;
    }


    div.innerHTML = `

      <div class="soon">
        ${escapeHTML(item.name)}
      </div>

      <div>
        ${timing}
      </div>

      <div class="muted">
        Estimated use-by:
        ${escapeHTML(item.estimatedDate)}
      </div>

    `;


    container.appendChild(div);
  });
}


/* ============================================================
   INITIALIZE
   ============================================================ */

renderPantry();
renderUseSoon();

</script>

</body>
</html>
