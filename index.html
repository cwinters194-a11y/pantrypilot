<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PantryPilot</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f4ef;color:#222}
main{max-width:680px;margin:auto;padding:24px 18px 48px}
h1{margin:0 0 6px} p{line-height:1.45}.card{background:white;border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 1px 5px #0001}
button{border:0;border-radius:12px;padding:13px 16px;font-size:16px;background:#222;color:white;margin:5px 0}
button.secondary{background:#eee;color:#222}
input[type=file]{width:100%;padding:12px 0}
.item{border-top:1px solid #eee;padding:14px 0}.item:first-child{border-top:0}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
input[type=text],input[type=date]{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:9px;font-size:16px}
.small{color:#666;font-size:13px}.status{white-space:pre-wrap;background:#f2f2f2;padding:12px;border-radius:10px}
</style>
</head>
<body>
<main>
<h1>PantryPilot</h1>
<p>Receipt → groceries → pantry</p>

<div class="card">
<h2>Scan a receipt</h2>
<input id="photo" type="file" accept="image/*" capture="environment">
<button onclick="readReceipt()">Read receipt</button>
<div id="status" class="status">Ready.</div>
</div>

<div id="review" class="card" style="display:none">
<h2>Review groceries</h2>
<p class="small">Correct anything the OCR or product matching got wrong before adding it.</p>
<div id="items"></div>
<button onclick="addToPantry()">Add to Pantry</button>
</div>

<div id="pantry" class="card">
<h2>Pantry</h2>
<div id="pantryItems" class="small">No items yet.</div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const shelf = {
 milk:7,yogurt:14,cheese:21,egg:21,chicken:2,beef:3,pork:3,fish:2,bread:7,
 berry:5,green:7,cilantro:7,apple:21,orange:21,banana:5,avocado:7,tomato:7,
 ranch:60,wrapper:7,patty:90,burger:90,crumbles:90
};
let pending=[];

function daysFor(name){
  const n=name.toLowerCase();
  for(const k in shelf) if(n.includes(k)) return shelf[k];
  return 14;
}
function datePlus(days){
  const d=new Date(); d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function renderReview(){
  const el=document.getElementById('items');
  el.innerHTML='';
  pending.forEach((x,i)=>{
    el.innerHTML += `<div class="item">
      <input type="text" value="${esc(x.name)}" onchange="pending[${i}].name=this.value">
      <div class="row">
        <input type="text" value="${esc(x.storage)}" onchange="pending[${i}].storage=this.value">
        <input type="date" value="${x.useBy}" onchange="pending[${i}].useBy=this.value">
      </div>
      <div class="small">Receipt line: ${esc(x.raw)}</div>
    </div>`;
  });
  document.getElementById('review').style.display=pending.length?'block':'none';
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function readReceipt(){
 const f=document.getElementById('photo').files[0];
 if(!f){alert('Choose or take a receipt photo first.');return;}
 const status=document.getElementById('status');
 status.textContent='Reading receipt… this may take a little while on an iPhone.';
 try{
   const result=await Tesseract.recognize(f,'eng',{logger:m=>{
     if(m.status) status.textContent=m.status + (m.progress?` ${Math.round(m.progress*100)}%`:'');
   }});
   const text=result.data.text;
   pending=parseReceipt(text);
   status.textContent=`OCR complete. Found ${pending.length} likely grocery lines.`;
   renderReview();
 }catch(e){status.textContent='OCR failed: '+e.message;}
}

function parseReceipt(text){
 const lines=text.split(/\n/).map(s=>s.trim()).filter(Boolean);
 const out=[];
 for(const raw of lines){
   const u=raw.toUpperCase();
   if(/^(DAIRY|FROZEN FOODS|GROCERY|PRODUCE|SUBTOTAL|MN STATE TAX|HENNEPIN|EDINA|METRO|TOTAL|CREDIT|CHANGE|THANK YOU|CARD INFORMATION|CASHIER|STORE|TRX|TERM|NUMBER OF ITEMS)/.test(u)) continue;
   if(/^\$?\d+\.\d{2}\s*(TF|F)?$/.test(u)) continue;
   if(/(CITY BAG FEE|APPROVAL|REFERENCE|ACCOUNT|AMOUNT|DATE:|CARD NAME|MODE:|MID:|AID:)/.test(u)) continue;
   const price=u.match(/\$?\d+\.\d{2}/);
   if(!price) continue;
   let name=raw.replace(/\b\d{8,14}\b/g,'').replace(/\$?\d+\.\d{2}.*$/,'').trim();
   if(name.length<3) continue;
   name=normalize(name);
   if(!name) continue;
   const storage=storageFor(name);
   out.push({name,raw,storage,useBy:datePlus(daysFor(name))});
 }
 return out;
}
function normalize(s){
 let n=s.toLowerCase().replace(/\s+/g,' ').trim();
 const rules=[
  [/med chedd?ar bby lf/i,'Medium cheddar cheese'],
  [/msf grillers burg/i,'MorningStar Farms Grillers Burger'],
  [/meatless crumbles/i,'Meatless crumbles'],
  [/chicken patties/i,'Chicken patties'],
  [/msf grdn vg pattie/i,'MorningStar Farms Garden Veggie Patties'],
  [/fever tree ginger/i,'Fever-Tree ginger beer'],
  [/beer 8pk/i,'Beer, 8-pack'],
  [/coke diet 24 pk/i,'Diet Coke, 24-pack'],
  [/hddn vly ranch/i,'Hidden Valley Ranch'],
  [/cilantro/i,'Cilantro'],
  [/dill ranch squeeze/i,'Dill ranch dressing'],
  [/wonton wrapper/i,'Wonton wrappers']
 ];
 for(const [re,v] of rules) if(re.test(n)) return v;
 if(/^[a-z][a-z0-9 .,&'-]{2,40}$/i.test(n)) return s.trim();
 return null;
}
function storageFor(n){
 const x=n.toLowerCase();
 if(/chicken|patty|burger|crumbles/.test(x)) return 'Freezer';
 if(/cheddar|cilantro|wonton|ranch/.test(x)) return 'Refrigerator';
 return 'Pantry';
}
function addToPantry(){
 const p=JSON.parse(localStorage.getItem('pantrypilot')||'[]');
 pending.forEach(x=>p.push({...x,added:new Date().toISOString(),used:false}));
 localStorage.setItem('pantrypilot',JSON.stringify(p));
 pending=[]; renderReview(); renderPantry();
 document.getElementById('status').textContent='Added to pantry.';
}
function renderPantry(){
 const p=JSON.parse(localStorage.getItem('pantrypilot')||'[]');
 const el=document.getElementById('pantryItems');
 if(!p.length){el.textContent='No items yet.';return;}
 el.innerHTML=p.map((x,i)=>`<div class="item"><b>${esc(x.name)}</b><br>
 ${esc(x.storage)} · use by ${esc(x.useBy)}<br>
 <button class="secondary" onclick="useItem(${i})">Mark used</button></div>`).join('');
}
function useItem(i){
 const p=JSON.parse(localStorage.getItem('pantrypilot')||'[]');
 p.splice(i,1); localStorage.setItem('pantrypilot',JSON.stringify(p)); renderPantry();
}
renderPantry();
</script>
</body>
</html>
