<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PantryPilot</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:720px;margin:auto;padding:18px;background:#f7f7f7} .card{background:#fff;padding:16px;margin:12px 0;border-radius:14px;box-shadow:0 1px 5px #0001}button{padding:10px 13px;border:0;border-radius:9px;margin:3px}.primary{background:#222;color:#fff}.item{background:#fff;border:1px solid #ddd;padding:10px;margin:8px 0;border-radius:10px}.needs{border-left:5px solid #d98b00}.row{display:flex;gap:8px;align-items:center}.row input:not([type=checkbox]){flex:1}.small{font-size:13px;color:#666}progress{width:100%}pre{white-space:pre-wrap;background:#f2f2f2;padding:10px;max-height:280px;overflow:auto}</style></head><body><h1>PantryPilot</h1><p class="small">Scan a receipt, review plausible grocery items, then add them to your pantry.</p><div class="card"><input id="file" type="file" accept="image/*" capture="environment"><button class="primary" onclick="scan()">Scan receipt</button><p id="status" class="small"></p><progress id="prog" value="0" max="100" hidden></progress></div><div id="review" class="card" hidden><h2>Review items <span id="count"></span></h2><p class="small">V3.1 filters obvious OCR garbage more aggressively while preserving plausible uncertain lines.</p><button onclick="all(true)">Check all</button><button onclick="all(false)">Uncheck all</button><div id="items"></div><button class="primary" onclick="add()">Add checked items to pantry</button><details><summary>Show raw OCR</summary><pre id="raw"></pre></details></div><div class="card"><h2>Pantry <span id="pc"></span></h2><div id="pantry"></div></div><script>
const known=[['medium cheddar cheese',21],['cheddar cheese',21],['cheese',21],['morningstar farms grillers burger',14],['meatless crumbles',7],['chicken patties',7],['morningstar farms garden veggie patties',14],['fever-tree ginger beer',90],['beer',90],['diet coke',180],['hidden valley ranch',30],['cilantro',7],['dill ranch dressing',30],['wonton wrappers',7]];
const words=['CHEESE','CHEDDAR','RANCH','CILANTRO','GINGER BEER','BEER','COKE','SODA','WONTON','WRAPPER','CHICKEN','PATTIES','BURGER','CRUMBLES','VEGGIE','YOGURT','MILK','BREAD','EGG','APPLE','BANANA','LETTUCE','TOMATO','POTATO','ONION','GARLIC','CARROT','CEREAL','PASTA','SAUCE','DRESSING','SOUP','FROZEN','CHIPS','CRACKER','COFFEE','TEA','JUICE','WATER','MEAT','BEEF','PORK','TURKEY','FISH'];
let candidates=[],raw='';
function clean(s){return s.replace(/[|¦]/g,' ').replace(/\s+/g,' ').replace(/^[^\w]+|[^\w).%-]+$/g,'').trim()}
function norm(s){return clean(s).toUpperCase().replace(/\bHDDN\b/g,'HIDDEN').replace(/\bVLY\b/g,'VALLEY').replace(/\bGRDN\b/g,'GARDEN').replace(/\bVG\b/g,'VEGGIE').replace(/\bCHKN\b/g,'CHICKEN').replace(/\bCIL\b/g,'CILANTRO').replace(/\bWTN\b/g,'WONTON').replace(/\bWRP[S]?\b/g,'WRAPPERS').replace(/\bGRILLER[S]?\b/g,'GRILLERS').replace(/\bCRMBL[S]?\b/g,'CRUMBLES').replace(/\s+/g,' ').trim()}
function score(s){let x=norm(s),n=0;words.forEach(w=>{if(x.includes(w))n+=4});if(/\b\d+\s*(PK|PACK|CT|COUNT|OZ|LB|L|ML|GAL)\b/i.test(x))n+=2;if(/\d+\.\d{2}\s*$/.test(x))n+=1;return n}
function bad(s){let x=norm(s);return !x||x.length<3||/^(SUBTOTAL|TOTAL|TAX|CHANGE|CASH|CREDIT|DEBIT|VISA|MASTERCARD|AMEX|DISCOVER|BALANCE|TENDER|PAYMENT|SAVINGS|COUPON|DISCOUNT|LOYALTY|MEMBER|REWARD|TRANSACTION|AUTH|APPROVAL|CARD|QTY|PRICE|ITEM|DESCRIPTION|UPC|STORE|REGISTER|LANE|DATE|TIME)$/i.test(x)||/^[\d\s$.,%#*:+\-\/]+$/.test(x)}
function canonical(s){let x=norm(s).toLowerCase();for(const [k] of known){if(x.includes(k))return k.replace(/\b\w/g,c=>c.toUpperCase())}return clean(s)}
function days(n){let x=n.toLowerCase();for(const [k,d] of known)if(x.includes(k))return d;return /fresh|produce|herb/.test(x)?7:14}
function datePlus(d){let x=new Date();x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)}
async function scan(){let f=document.getElementById('file').files[0];if(!f)return alert('Choose a receipt photo first.');let st=document.getElementById('status'),p=document.getElementById('prog');p.hidden=false;st.textContent='Reading receipt…';try{let r=await Tesseract.recognize(f,'eng',{logger:m=>{if(m.progress)p.value=Math.round(m.progress*100);if(m.status)st.textContent=m.status}});raw=r.data.text||'';parse(raw);render();st.textContent='Found '+candidates.length+' plausible grocery lines.'}catch(e){console.error(e);st.textContent='Scan failed. Try a clearer photo.'}}
function parse(t){let seen=new Set(),out=[];for(let l of t.split(/\r?\n/).map(clean)){if(bad(l)||score(l)<4)continue;let name=canonical(l),key=name.toLowerCase();if(seen.has(key))continue;seen.add(key);out.push({raw:l,name,checked:true,conf:score(l)>=8?'Confident':'Needs review',days:days(name)})}let joined=norm(t);for(const [k,d] of known){let pat=k.split(' ').map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s+');if(new RegExp(pat,'i').test(joined)&&!seen.has(k)){seen.add(k);out.push({raw:k,name:k.replace(/\b\w/g,c=>c.toUpperCase()),checked:true,conf:'Confident',days:d})}}candidates=out}
function render(){document.getElementById('review').hidden=false;document.getElementById('count').textContent='('+candidates.length+')';document.getElementById('raw').textContent=raw;let b=document.getElementById('items');b.innerHTML='';candidates.forEach((x,i)=>{let d=document.createElement('div');d.className='item '+(x.conf==='Needs review'?'needs':'');d.innerHTML='<div class="row"><input type="checkbox" '+(x.checked?'checked':'')+' onchange="candidates['+i+'].checked=this.checked"><input value="'+esc(x.name)+'" onchange="candidates['+i+'].name=this.value"><span class="small">'+x.conf+'</span></div><div class="row"><span class="small">Estimated</span><input type="date" value="'+datePlus(x.days)+'" onchange="candidates['+i+'].date=this.value"></div><div class="small">OCR: '+esc(x.raw)+'</div>';b.appendChild(d)})}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function all(v){candidates.forEach(x=>x.checked=v);render()}function add(){let p=JSON.parse(localStorage.getItem('pantrypilot')||'[]');candidates.filter(x=>x.checked).forEach(x=>p.push({name:x.name,date:x.date||datePlus(x.days)}));localStorage.setItem('pantrypilot',JSON.stringify(p));pantry();alert('Checked items added to pantry.')}function pantry(){let p=JSON.parse(localStorage.getItem('pantrypilot')||'[]');document.getElementById('pc').textContent='('+p.length+')';let b=document.getElementById('pantry');b.innerHTML=p.length?p.map((x,i)=>'<div class="item"><div class="row"><strong>'+esc(x.name)+'</strong><span class="small">'+esc(x.date||'')+'</span><button onclick="rm('+i+')">Remove</button></div></div>').join(''):'<p class="small">No items yet.</p>'}function rm(i){let p=JSON.parse(localStorage.getItem('pantrypilot')||'[]');p.splice(i,1);localStorage.setItem('pantrypilot',JSON.stringify(p));pantry()}pantry();
</script></body></html>
